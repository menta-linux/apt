name: Publish apt repository

on:
  workflow_dispatch:      # manual only: Actions -> Publish apt repository -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg xz-utils

      - name: Download the artifacts (one release per channel)
        env:
          # Needs read access to menta-linux/artifacts (public: the workflow token is enough).
          GH_TOKEN: ${{ secrets.MENTA_TOKEN || github.token }}
          ARTIFACTS_REPO: menta-linux/artifacts
        run: |
          mkdir -p debs
          for tag in $(gh release list -R "$ARTIFACTS_REPO" --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName'); do
            echo "== channel $tag"
            mkdir -p "debs/$tag"
            gh release download "$tag" -R "$ARTIFACTS_REPO" -p '*.deb' -D "debs/$tag" --clobber || echo "::warning::no .deb files in release $tag"
          done
          find debs -name '*.deb' | wc -l

      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | gpg --batch --import
            echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APT_GPG_PRIVATE_KEY is not set: publishing an UNSIGNED repository"
          fi

      - name: Build repository
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.id }}
        run: |
          ./build-repo.sh debs site
          cp setup.sh site/setup.sh
          cp index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
